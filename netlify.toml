[build]
  publish = "."

# Redirect legacy .html URLs to the clean equivalents (SEO-safe permanent redirects)
[[redirects]]
  from = "/about.html"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/services.html"
  to = "/services/"
  status = 301
[[redirects]]
  from = "/projects.html"
  to = "/projects/"
  status = 301
[[redirects]]
  from = "/gallery.html"
  to = "/gallery/"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
